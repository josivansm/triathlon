name: Sincronizar Garmin

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia às 10:00 UTC (6h em Manaus, 7h em Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados no Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python scripts/sync.py
      - name: Salvar no repositório
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualiza dados $(date -u +%F)"
          git push
